openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: metrics
    description: Live metrics and session tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /metrics:
    get:
      operationId: getMetrics
      tags: [metrics]
      summary: Get current metrics snapshot
      responses:
        "200":
          description: Current metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsPayload"
  /metrics/stream:
    get:
      operationId: streamMetrics
      tags: [metrics]
      summary: SSE stream of live metrics
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
  /metrics/heartbeat:
    post:
      operationId: heartbeat
      tags: [metrics]
      summary: Register active session heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsPayload"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MetricsPayload:
      type: object
      properties:
        activeUsers:
          type: integer
        totalSubscribers:
          type: integer
      required:
        - activeUsers
        - totalSubscribers
    HeartbeatRequest:
      type: object
      properties:
        sessionId:
          type: string
      required:
        - sessionId
